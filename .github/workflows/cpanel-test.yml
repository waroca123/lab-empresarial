name: Investigar API Git de cPanel

on:
  workflow_dispatch:

jobs:
  investigar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar funciones UAPI disponibles
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          echo "=== Consultando funciones UAPI disponibles ==="

          curl --silent --show-error \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/API/get_functions" \
            | python3 -m json.tool
