name: Probar conexion con cPanel

on:
  workflow_dispatch:

jobs:
  test-cpanel:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar conexion con la API de cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          echo "=== Diagnostico cPanel UAPI ==="
          echo "Servidor: ${CPANEL_HOST}"
          echo "Usuario: ${CPANEL_USER}"
          echo "Probando HTTPS puerto 2083..."

          curl \
            --connect-timeout 15 \
            --max-time 30 \
            --show-error \
            --include \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Variables/get_user_information"
