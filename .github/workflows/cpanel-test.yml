name: Desplegar en cPanel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar repositorio de cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          echo "Actualizando repositorio..."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/update-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "repository_root=/home/chfyhzlp/repos/lab-empresarial" \
            --data-urlencode "branch=main" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update")

          echo "HTTP: ${HTTP_CODE}"
          cat /tmp/update-response.txt
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "ERROR: fallo HTTP actualizando el repositorio."
            exit 1
          fi

          if grep -qi "<!DOCTYPE html" /tmp/update-response.txt; then
            echo "ERROR: cPanel bloqueo la solicitud de actualizacion."
            exit 1
          fi

          if ! python3 -m json.tool /tmp/update-response.txt >/dev/null 2>&1; then
            echo "ERROR: cPanel no devolvio JSON valido."
            exit 1
          fi

          STATUS=$(python3 -c "import json; print(json.load(open('/tmp/update-response.txt')).get('status', 0))")

          if [ "${STATUS}" != "1" ]; then
            echo "ERROR: cPanel rechazo la actualizacion."
            exit 1
          fi

          echo "Repositorio actualizado correctamente."

      - name: Desplegar HEAD en produccion
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          echo "Iniciando deployment..."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/deploy-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "repository_root=/home/chfyhzlp/repos/lab-empresarial" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create")

          echo "HTTP: ${HTTP_CODE}"
          cat /tmp/deploy-response.txt
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "ERROR: fallo HTTP iniciando el deployment."
            exit 1
          fi

          if grep -qi "<!DOCTYPE html" /tmp/deploy-response.txt; then
            echo "ERROR: la proteccion del servidor bloqueo el deployment desde GitHub Actions."
            exit 1
          fi

          if ! python3 -m json.tool /tmp/deploy-response.txt >/dev/null 2>&1; then
            echo "ERROR: cPanel no devolvio JSON valido."
            exit 1
          fi

          STATUS=$(python3 -c "import json; print(json.load(open('/tmp/deploy-response.txt')).get('status', 0))")

          if [ "${STATUS}" != "1" ]; then
            echo "ERROR: cPanel rechazo el deployment."
            exit 1
          fi

          echo "Deployment creado correctamente."
